<style>
:root{--panel:#fff;--ink:#1c2730;--mut:#5d6b76;--line:#dde2e6;--acc:#1f4e5f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f6f7f8;display:flex}
#side{width:360px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
#map{flex:1;height:100%;background:#e9edf0}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 2px;color:var(--acc)}header p{margin:0;color:var(--mut);font-size:12px}
.sec{padding:10px 16px;border-bottom:1px solid var(--line)}
.sec h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 6px}
label.f{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;font-size:13px}
label.f .n{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.sw{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.ln{width:18px;height:0;border-top:4px solid #888;flex:none}
input[type=search]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit}
#list{overflow:auto;flex:1}
.it{padding:7px 16px;border-bottom:1px solid #eef1f3;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.it:hover{background:#f0f5f7}.it b{display:block;font-weight:600;font-size:13px}.it span{color:var(--mut);font-size:12px}
.pop b{font-size:14px}.pop table{border-collapse:collapse;margin-top:4px}.pop td{padding:1px 8px 1px 0;vertical-align:top;font-size:12px}.pop td:first-child{color:#5d6b76;white-space:nowrap}
.btn{display:inline-block;margin-top:8px;padding:7px 12px;background:var(--acc);color:#fff!important;border-radius:6px;text-decoration:none;font-weight:600;font-size:13px}
#count{font-size:12px;color:var(--mut);padding:6px 16px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;background:#eef1f3;color:#445}
.tag.now{background:#e3f3e5;color:#1e6b2a}.tag.late{background:#fde8e6;color:#a12a20}.tag.soon{background:#fff3d6;color:#8a5a00}
@media(max-width:760px){body{flex-direction:column}#side{width:100%;height:46%;border-right:0;border-top:1px solid var(--line);order:2}#map{height:54%}}
